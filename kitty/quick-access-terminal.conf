# Quick-access (Quake-style dropdown) terminal
# Docs: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

# Drop down from the top of the screen
edge top

# Size of the panel
lines 25
columns 100

# Slight transparency
background_opacity 0.9

# Auto-hide when it loses focus (feels like a proper dropdown)
hide_on_focus_loss yes

# Start hidden; first hotkey press reveals it
start_as_hidden yes
